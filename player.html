<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordPlayer — IELTS Vocabulary Audio</title>
<style>
:root {
  --bg:        #F9F8F6;
  --surface:   #FFFFFF;
  --text:      #1C1C1E;
  --text-dim:  #8E8E93;
  --accent:    #0B5CAD;
  --accent-bg: #EEF4FB;
  --play:      #0D9488;
  --play-bg:   #E6F7F5;
  --stop:      #DC2626;
  --stop-bg:   #FEF2F2;
  --border:    #E8E6E1;
  --rule:      #EDEBE6;
  --shadow:    0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 16px 64px;
  -webkit-font-smoothing: antialiased;
}

.app {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── header ──────────────────────────── */
.header {
  text-align: center;
  padding: 8px 0 0;
}

.header h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}

.header p {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ── word input ──────────────────────── */
.input-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.input-card textarea {
  display: block;
  width: 100%;
  height: 260px;
  padding: 16px 20px;
  border: none;
  outline: none;
  resize: vertical;
  font-family: "SF Mono", "Fira Code", "Consolas", "Menlo", monospace;
  font-size: 16px;
  line-height: 1.8;
  color: var(--text);
  background: #FAFAF9;
}

.input-card textarea::placeholder {
  color: #C4C1BA;
}

.input-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 20px;
  border-top: 1px solid var(--border);
  background: #FAFAF8;
  font-size: 12px;
  color: var(--text-dim);
}

/* ── now playing ─────────────────────── */
.now-playing {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 32px 24px 28px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: border-color 0.4s, box-shadow 0.4s;
  position: relative;
  overflow: hidden;
}

.now-playing.active {
  border-color: var(--accent);
  box-shadow: var(--shadow-md), 0 0 0 4px var(--accent-bg);
}

.now-playing .eyebrow {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.now-playing .word-display {
  font-family: "Georgia", "Times New Roman", serif;
  font-size: 56px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--text);
  letter-spacing: -0.005em;
  transition: opacity 0.25s, transform 0.25s;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.word-display.fade {
  opacity: 0;
  transform: translateY(6px);
}

.now-playing .counter {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

.now-playing .progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  background: var(--accent);
  border-radius: 0 2px 0 0;
  transition: width 0.35s ease;
}

/* play state indicator */
.now-playing .state-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  position: relative;
  top: -1px;
}

.state-dot.idle  { background: var(--text-dim); }
.state-dot.play  { background: var(--play); animation: pulse-dot 1.2s ease-in-out infinite; }
.state-dot.pause { background: #F59E0B; }

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .4; transform: scale(1.6); }
}

/* ── main controls ───────────────────── */
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 11px 22px;
  font-size: 15px;
  font-weight: 550;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  user-select: none;
}

.btn:active { transform: scale(0.97); }

.btn-play {
  background: var(--play);
  color: #fff;
}

.btn-play:hover { background: #0B8578; }

.btn-pause {
  background: #F5F0E0;
  color: #8B6914;
}

.btn-pause:hover { background: #EDE6CE; }

.btn-stop {
  background: var(--stop-bg);
  color: var(--stop);
}

.btn-stop:hover { background: #FDE8E8; }

.btn:disabled {
  opacity: 0.4;
  pointer-events: none;
}

/* ── settings ────────────────────────── */
.settings {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.settings label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
}

.settings select,
.settings input[type="number"] {
  padding: 6px 10px;
  font-size: 14px;
  font-family: inherit;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.settings select:focus,
.settings input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg);
}

.settings input[type="number"] { width: 58px; text-align: center; }
.settings select { max-width: 200px; }

.settings input[type="checkbox"] {
  accent-color: var(--accent);
  width: 15px;
  height: 15px;
  cursor: pointer;
}

/* ── divider ─────────────────────────── */
.section-rule {
  border: none;
  border-top: 1px solid var(--rule);
  margin: 4px 0;
}

/* ── footer ──────────────────────────── */
.footer {
  text-align: center;
  font-size: 11px;
  color: #C4C1BA;
  padding-top: 8px;
}

/* ── responsive ──────────────────────── */
@media (max-width: 520px) {
  .now-playing .word-display { font-size: 40px; min-height: 48px; }
  .btn { padding: 10px 16px; font-size: 14px; }
  .settings { gap: 8px; }
  body { padding: 12px 10px 40px; }
  .app { gap: 14px; }
}

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  .word-display.fade { transition: none; }
  .state-dot.play { animation: none; }
}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <h1>WordPlayer</h1>
    <p>IELTS vocabulary &middot; repeat &middot; listen</p>
  </header>

  <!-- word input -->
  <div class="input-card">
    <textarea id="wordArea" placeholder="Paste your word list, one per line&#10;Chinese text is automatically filtered&#10;&#10;innovation&#10;invention&#10;device&#10;equipment"></textarea>
    <div class="input-footer">
      <span id="wordCount">0 words</span>
      <span>Chinese auto‑filtered</span>
    </div>
  </div>

  <!-- now playing -->
  <div class="now-playing" id="nowPlaying">
    <div class="eyebrow" id="stateLabel">ready</div>
    <div class="word-display" id="wordDisplay">—</div>
    <div class="counter" id="counter">&nbsp;</div>
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <!-- main controls -->
  <div class="controls">
    <button class="btn btn-play" id="startBtn">▶&ensp;Play</button>
    <button class="btn btn-pause" id="pauseBtn" disabled>⏸&ensp;Pause</button>
    <button class="btn btn-stop" id="stopBtn">⏹&ensp;Stop</button>
  </div>

  <hr class="section-rule">

  <!-- settings -->
  <div class="settings">
    <select id="voiceSel"></select>
    <label>Speed <input id="rate" type="number" value="0.8" min="0.4" max="1.5" step="0.05"></label>
    <label>Gap <input id="gap" type="number" value="2.5" min="1" max="10" step="0.25">s</label>
    <label>Repeat <input id="repeat" type="number" value="1" min="1" max="5">×</label>
    <label><input id="randMode" type="checkbox"> Shuffle</label>
  </div>

  <div class="footer">WordPlayer &middot; browser speech synthesis</div>

</div>

<script>
// ── DOM refs ───────────────────────────
const wordArea   = document.getElementById('wordArea');
const startBtn   = document.getElementById('startBtn');
const pauseBtn   = document.getElementById('pauseBtn');
const stopBtn    = document.getElementById('stopBtn');
const voiceSel   = document.getElementById('voiceSel');
const rateInp    = document.getElementById('rate');
const gapInp     = document.getElementById('gap');
const repeatInp  = document.getElementById('repeat');
const randMode   = document.getElementById('randMode');
const wordCount  = document.getElementById('wordCount');
const wordDisplay= document.getElementById('wordDisplay');
const counter    = document.getElementById('counter');
const progressBar= document.getElementById('progressBar');
const stateLabel = document.getElementById('stateLabel');
const nowPlaying = document.getElementById('nowPlaying');

const synth = window.speechSynthesis;
let voices = [];
let wordList = [];
let idx = 0;
let gapTimer = null;
let paused = false;
let stopped = false;

// ── word count live update ─────────────
wordArea.addEventListener('input', function () {
    const words = extractEnglish(wordArea.value);
    wordCount.textContent = words.length + ' word' + (words.length !== 1 ? 's' : '');
});

// ── voices ─────────────────────────────
function loadVoices() {
    voices = synth.getVoices();
    if (voices.length === 0) return;
    voiceSel.innerHTML = '';
    voices.forEach(function (v, i) {
        var opt = document.createElement('option');
        opt.textContent = v.name + ' (' + v.lang + ')';
        opt.value = i;
        voiceSel.appendChild(opt);
    });
    var flo = voices.findIndex(function (x) { return x.name === 'Flo'; });
    if (flo >= 0) { voiceSel.value = flo; return; }
    var uk = voices.findIndex(function (x) { return x.lang.startsWith('en-GB'); });
    if (uk >= 0) voiceSel.value = uk;
}
synth.onvoiceschanged = loadVoices;
loadVoices();
setTimeout(function () { if (voices.length === 0) loadVoices(); }, 500);

// ── word extraction ────────────────────
function extractEnglish(raw) {
    return raw.split(/\r?\n/)
        .map(function (L) { return L.replace(/[一-龥]|#|——|…/g, '').trim(); })
        .filter(Boolean);
}

// ── shuffle ────────────────────────────
function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
}

// ── update display ─────────────────────
function setWordUI(word) {
    wordDisplay.classList.add('fade');
    setTimeout(function () {
        wordDisplay.textContent = word;
        wordDisplay.classList.remove('fade');
    }, 200);
    counter.textContent = (idx + 1) + ' / ' + wordList.length;
    progressBar.style.width = ((idx + 1) / wordList.length * 100).toFixed(1) + '%';
}

function setState(mode) {
    nowPlaying.classList.remove('active');
    stateLabel.innerHTML = '<span class="state-dot idle"></span> ready';
    if (mode === 'play') {
        nowPlaying.classList.add('active');
        stateLabel.innerHTML = '<span class="state-dot play"></span> playing';
    } else if (mode === 'pause') {
        nowPlaying.classList.add('active');
        stateLabel.innerHTML = '<span class="state-dot pause"></span> paused';
    }
}

// ── speech engine ──────────────────────
function speakNext() {
    if (stopped || idx >= wordList.length) {
        stopPlay();
        return;
    }
    if (paused) return;

    var word = wordList[idx];
    setWordUI(word);
    setState('play');
    idx++;

    var u = new SpeechSynthesisUtterance(word);
    var v = voices[voiceSel.value];
    if (v) u.voice = v;
    u.rate = Number(rateInp.value);
    u.volume = 1;

    u.onend = function () {
        if (stopped || paused) return;
        gapTimer = setTimeout(speakNext, Number(gapInp.value) * 1000);
    };

    u.onerror = function (e) {
        if (e.error !== 'canceled' && !stopped) {
            gapTimer = setTimeout(speakNext, Number(gapInp.value) * 1000);
        }
    };

    synth.speak(u);
}

// ── play / pause / stop ────────────────
function startPlay() {
    wordList = extractEnglish(wordArea.value);
    if (wordList.length === 0) {
        alert('Please paste some words first.');
        return;
    }
    var repeats = Number(repeatInp.value) || 1;
    if (repeats > 1) {
        var expanded = [];
        for (var wi = 0; wi < wordList.length; wi++) {
            for (var r = 0; r < repeats; r++) expanded.push(wordList[wi]);
        }
        wordList = expanded;
    }
    if (randMode.checked) shuffle(wordList);

    idx = 0;
    stopped = false;
    paused = false;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    pauseBtn.innerHTML = '⏸&ensp;Pause';
    progressBar.style.width = '0%';
    setState('play');
    speakNext();
}

function stopPlay() {
    stopped = true;
    synth.cancel();
    clearTimeout(gapTimer);
    idx = 0;
    paused = false;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    pauseBtn.innerHTML = '⏸&ensp;Pause';
    wordDisplay.textContent = '—';
    counter.innerHTML = '&nbsp;';
    progressBar.style.width = '0%';
    setState('idle');
}

function togglePause() {
    if (paused) {
        paused = false;
        pauseBtn.innerHTML = '⏸&ensp;Pause';
        setState('play');
        synth.resume();
        if (!synth.speaking) {
            gapTimer = setTimeout(speakNext, Number(gapInp.value) * 1000);
        }
    } else {
        paused = true;
        pauseBtn.innerHTML = '▶&ensp;Resume';
        setState('pause');
        synth.pause();
        clearTimeout(gapTimer);
    }
}

startBtn.onclick = startPlay;
pauseBtn.onclick = togglePause;
stopBtn.onclick = stopPlay;

// init word count
wordArea.dispatchEvent(new Event('input'));
</script>
</body>
</html>
